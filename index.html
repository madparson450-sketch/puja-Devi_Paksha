<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A six-day interactive Durga Puja celebration.">
  <title>দুর্গোৎসবDevi_Paksha</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <section class="player-dock" aria-label="Music player">
    <button id="playlistToggle" class="round-control" type="button" aria-label="Show playlist" aria-expanded="false">☰</button>
    <div class="track-info"><span id="trackTitle">Devotional Songs</span><small id="trackArtist">Choose a song to begin</small></div>
    <button id="previous" class="round-control" type="button" aria-label="Previous song">‹</button>
    <button id="playPause" class="play-control" type="button" aria-label="Play selected song">▶</button>
    <button id="next" class="round-control" type="button" aria-label="Next song">›</button>
    <input id="progress" class="progress" type="range" min="0" max="100" value="0" aria-label="Song progress">
    <span id="time" class="time">0:00 / 0:00</span>
    <input id="volume" class="volume" type="range" min="0" max="1" step="0.05" value="0.8" aria-label="Volume">
    <audio id="audio"></audio>
  </section>
  <nav id="bottomNav" class="bottom-nav" aria-label="Festival days"></nav>
  <script src="script.js?v=20260818"></script>
</body>
</html>
